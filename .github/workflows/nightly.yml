name: Nightlies

on:
  pull_request:
  push:
    branches:
      - dev
      - main
    paths:
      - 'src/**'
      - '.github/workflows/nightly.yml'
  schedule:
    - cron: '15 0 * * 3' # Every Wednesday at 00:15 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          show-progress: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: |
          dotnet restore
          dotnet build EloReputation.csproj --no-restore
          dotnet publish EloReputation.csproj --no-build --no-restore

      - uses: actions/upload-artifact@v4.0.0
        with:
          name: elorep-nightly
          path: build/
          # If build didn't put any artifacts in the build folder, consider it an error
          if-no-files-found: error